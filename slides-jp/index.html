### 台風はなぜ迷走するのか

<div class="simple-box">

* 台風は自分で進むのではなく、**周りの大きな風 (指向流) に流される**
  * 教科書の経路: 太平洋高気圧のへりを回って北上し、偏西風に乗って北東へ
* 指向流が弱いと、行き先が決まらず**迷走**する

</div>

<br>

<div class="highlight-box">

クロヴァンも、指向流が弱いところで止まった**のかもしれない** (※ 今回は未検証)

### 天気予報 = 初期値 + モデル

<div class="simple-box dense">

* **初期値: ERA5** (ヨーロッパの再解析データ)
  * 過去の観測を総動員して作り直した、地球の大気の状態
  * 約 31 km (0.25° の格子で配布)、1 時間ごと
* **モデル: WeatherNext 2** (Google DeepMind)
  * 0.25° (約 25 km) の格子、6 時間 × 40 回 = **10 日先まで**
  * 学習は 2024 年まで。今日の台風はどれも**学習の外**
  * 後継のWeatherNext 3が発表されているが、モデルは一般には未公開

</div>

<div class="highlight-box dense">

* 初期値は「後から観測を集めて作った状態」
* **実際の予報の腕試しではなく**、「状態がよく分かっていたら、どこまで先を読めるか」(予測可能性) の実験

</div>

Note: ERA5 の速報版 (ERA5T) を使っている。ARCO-ERA5 は数か月遅れるので使えなかった。

### アンサンブル: 1 回の予報で 8 本

<div class="simple-box">

* 天気予報は初期値鋭敏: 小さな違いが数日で大きく育つ
* WeatherNext 2 はモデルの中に**ノイズ**を入れて、同じ初期値から**少しずつ違う未来**を出す
* 8 本の**ばらつき = 予報の自信のなさ**

</div>

<br>

<div class="highlight-box">

今回は 8 本とも**初期値は同じ ERA5**。ばらつきはゼロから育つ (あとで効いてくる)

</div>

### 台風の中心をどう追うか

<div class="simple-box">

* WeatherNext 2 に**付属の追跡プログラム**をそのまま使う (自作しない)
* 6 時間ごとに**閉じた渦**を見つけて、つないで経路にする
* 観測の位置は**一切渡さない**: モデルが自分で台風を生む
* 台風になった時刻に観測に一番近い渦を、その台風とする

</div>

<div class="highlight-box">

追跡プログラムが追うのは「台風」ではなく「**渦**」(あとで効いてくる)

</div>

Note: 観測の位置を渡しても 6 時間後以降の経路は変わらなかった。渡すと 2.5 日未満の経路を消すフィルタが外れるので、全ケース渡さないことにした。

### 割れた。そして誰もループしない

<div class="simple-box">

* 40 本の行き先: **北 30 本**、大陸 4 本、東 1 本、観測の範囲内 5 本
  * 北の組も 1 つではない。大半は九州・本州へ、**朝鮮半島へ向かったものが 3 本ほど**
* 観測のループを再現したメンバーは **0 本**
* 予報の開始を 6 時間ずつずらしても、傾向は同じ

</div>

<br>

<div class="highlight-box">

最初の 2 日の誤差は 70–120 km。ERA5 自身の台風の位置のずれ (23–110 km) と同じくらい

</div>

Note: 「開始が遅いほど良くなる」という単調な傾向もない。8 本・1 台風では、開始時刻の効果は解析のノイズに埋もれる。朝鮮半島の 3 本は図から目で数えた値 (行き先の表は NAS とともに失われた): 09-01 12Z 開始の 2 本が半島の西岸と南岸に届き、09-01 00Z 開始の 1 本は済州島の西で北上中に途切れる。行き先の「北」は観測の箱の北辺から出たという意味で、朝鮮半島へ向かった組も含む。

<text x="378" y="140" font-size="22" fill="#2a78d6" text-anchor="end">道からの距離</text>
<text x="430" y="215" font-size="20" fill="#111">最寄り点: 観測が通ったのは t + 6 h</text>

<text x="660" y="140" font-size="20" fill="#111">観測の経路</text>

<div class="simple-box dense">

* **道**: 予報の位置から観測の経路までの最短距離。200 km 以内なら「道の上」
* **時計**: 最寄り点を観測の台風が通った時刻 − 予報の時刻。<b>+ なら先行</b> (この例は +6 h)
* 経路の端より先に行った位置は、道を外れたとは数えず別に数える

</div>

Note: 進行方向に沿った「前後・左右」に分ける普通のやり方は、ループで向きが回るクロヴァンには使えない。

### 台風の経路の Péclet 数

<svg class="diagram" viewBox="0 0 800 200" width="640" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<defs><marker id="arrow-pe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker></defs>
<polyline points="40,160 120,135 205,115 285,85 365,60" fill="none" stroke="#2a78d6" stroke-width="4" marker-end="url(#arrow-pe)"/>
<line x1="40" y1="160" x2="365" y2="60" stroke="#e0692e" stroke-width="3" stroke-dasharray="8 6"/>
<polyline points="520,120 600,80 640,150 570,170 610,105" fill="none" stroke="#2a78d6" stroke-width="4" marker-end="url(#arrow-pe)"/>
<line x1="520" y1="120" x2="610" y2="105" stroke="#e0692e" stroke-width="3" stroke-dasharray="8 6"/>
<text x="200" y="195" font-size="22" text-anchor="middle">Pe 大: 向きがそろう</text>
<text x="590" y="195" font-size="22" text-anchor="middle">Pe 小: うろうろ</text>
<text x="700" y="60" font-size="18" fill="#e0692e" text-anchor="middle">正味の移動</text>
</svg>

<div>
$$ \mathrm{Pe} = \frac{\left\lvert \sum_{i=1}^{n} \Delta \mathbf{x}_{i} \right\rvert^{2}}{\sum_{i=1}^{n} \left\lvert \Delta \mathbf{x}_{i} - \overline{\Delta \mathbf{x}} \right\rvert^{2}} $$
</div>

<div class="simple-box dense">

* 分子: 窓のあいだの**正味の移動** (ドリフト) の 2 乗
* 分母: 6 時間ごとの歩幅の**ばらつき** (拡散)。同じ歩幅から測るので、拡散係数を外から持ち込まない

</div>

---

### 仮定を足さない (1): 何と比べるか

<div class="simple-box dense">

* ランダムウォークなら Pe ≈ n / (n − 1) (4 歩で 1.33、Appendix)
* でも**台風はランダムウォークではない**。この値を基準にすると、「台風はこう動くはず」という仮定を 1 つ足すことになる
* → **同じ時刻・同じ長さの窓での、観測の台風の Pe** と比べる: $\log_{10} (\mathrm{Pe}^{\mathrm{member}} / \mathrm{Pe}^{\mathrm{obs}})$
  * 0: 観測と同じ / +1: メンバーの Pe が観測の 10 倍 (よりまっすぐ) / −1: 1/10 (よりうろうろ)

</div>

<div class="highlight-box dense">

測り方は**追加のメンバーを走らせる前に**書き残した (あとで独立に確かめるため)

</div>

---

### 仮定を足さない (2): 窓の長さ

<div class="simple-box dense">

* 窓の長さを 1 つに決める = **「何時間とどまったら停滞か」を測る側が決める**こと
* 同じ時刻でも、窓の長さで答えが変わる
  * 09-04 00Z のクロヴァン: 18 時間の窓で Pe 0.2 (うろうろ)、48 時間の窓で 2.3 (向きがそろう)
  * 停滞は約 1 日、ループは約 2 日。現象ごとに効く長さが違う
* 9 月に一度つまずいた: 「24 時間で 300 km 未満なら停滞」と決め打ちしたら、**遅いがまっすぐ**な動きまで停滞に数えていた (→「外れた仮説」)

</div>

<div class="highlight-box dense">

1 つに決めず、**18〜36 時間の窓を全部並べて**、窓の長さによらない特徴だけを読む

</div>

Note: 下限の 18 時間は、ばらつきを 3 歩以上から測れる最短の窓。2 歩 (12 時間) だと、ばらつきは 2 つの歩幅の差 1 つだけで決まってしまう。データから窓を自動で選ぶ方法 (Pe の時間変化の折れ目を読む) も試したが、どの時刻でも 12 時間に張り付いて使えなかった。

### Appendix: 時間伸縮 (DTW) を使わなかった理由

<div class="simple-box dense">

* DTW: 予報の各点を観測の経路の一区間に、順序を保って対応づける。時計と形が 1 回で出る…はず
* 道の上にいるメンバー: 最寄り点の時計と一致 (ドゥージェン: 順位相関 0.95、99% が 6 h 以内)
* 道を外れたメンバー: **どの終わり方でも人工物**が出る
  * 経路の終点に縛る → 尾が終点に引かれて「先行」
  * 終点を自由にする → 尾が 1 点に張りつき −1 h/h で「遅れ」(132 h で −75 h)
* 200 km 以内に限ると、最寄り点の時計と同じになる → **整列は何も足さない**

</div>

---

### Appendix: 開始時刻による差

<div class="simple-box">

* 「開始が遅いほど良くなる」という単調な傾向はない
* 最初の 2 日はどの回も 70–120 km (ERA5 の位置のずれ 23–110 km と同じくらい)
* どの回も 09-05 00Z (停滞とループ) に 400–670 km へ跳ねる
* 8 本・1 台風では、開始時刻の効果は解析のノイズに埋もれる

</div>

---

### Appendix: 台風の「発生」の時刻

<div class="simple-box">

* 12 時間前からの予報: 8 本中 7 本が、開始 6 時間後にはもう渦を見つけている
* 速報値の「発生」は**台風への昇格**、追跡は**どんな閉じた渦でも**拾う
  * → 今は「渦の検出」と「昇格」の比較になっている
* 確定値で熱帯低気圧の行が入れば、比べ直せる

</div>

---

### Appendix: ランダムウォークなら 1.33

<div class="simple-box dense">

歩幅 $\Delta \mathbf{x}_{i}$ が独立で平均 0、$\langle \lvert \Delta \mathbf{x} \rvert^{2} \rangle = s^{2}$ のとき

<div>
$$ \left\langle \left\lvert \sum_{i=1}^{n} \Delta \mathbf{x}_{i} \right\rvert^{2} \right\rangle = n s^{2}, \qquad \left\langle \sum_{i=1}^{n} \left\lvert \Delta \mathbf{x}_{i} - \overline{\Delta \mathbf{x}} \right\rvert^{2} \right\rangle = (n - 1) s^{2} $$
</div>

なので、期待値の比は $n / (n - 1)$ (4 歩なら 1.33)

</div>

<div class="highlight-box">

台風はランダムウォークではないので、この値は基準に使わなかった

</div>

---

### Appendix: 異常拡散の指数も試した

<div class="simple-box">

* 平均二乗変位 $\mathrm{MSD}(\tau) \propto \tau^{\alpha}$ の $\alpha$ なら、停滞 (閉じ込め) とループ (回転) を区別できる…かもしれない
* 6 時間ごとの位置、1〜2 日の窓では、観測も含めて**どの経路も 1.5–1.9**
* クロヴァンのループそのものでも 1.63
* → 6 時間おきのデータでは分解能が足りない

</div>

### Appendix: 追跡プログラムの癖

<div class="simple-box">

* 2.5 日 (60 時間) より短い経路は消される
* ペイパーは熱帯低気圧の期間を含めても 72 時間しかなく (台風としては 42 時間)、転向の前後で経路が切れると消える
  * 選ばれたのは 5 回それぞれ 8 本中 5, 8, 5, 8, 6 本
  * 消える制限を外して追い直すと、**全員が台風を持っていた**
* → 足りないのは追跡プログラムで、モデルではない

</div>

* メモリは最大 66 GB (小さい GPU では足りない)
* 地球全体の予報場は 1 本 17.1 GB、ほぼ圧縮できない (1.09 倍)
  * → 追跡に要る量だけ残し、台風の周りを切り出して保存
* 保存量: 1 回 8 本で 2.3 GB (クロヴァン) 〜 5.5 GB (ドゥージェン)
* 120 本で **約 30 USD**
