### 台風はなぜ迷走するのか

<div class="simple-box">

* 台風は自分で進むのではなく、**周りの大きな風 (指向流) に流される**
  * 教科書の経路: 太平洋高気圧のへりを回って北上し、偏西風に乗って北東へ
* 指向流が弱いと、行き先が決まらず**迷走**する

</div>

<div class="highlight-box">

### 天気予報 = 初期値 + モデル

<div class="simple-box dense">

* **初期値: ERA5** (欧州中期予報センターの再解析データ)
  * 過去の観測を総動員して作り直した、地球の大気の状態
  * 約 31 km (0.25° の格子で配布)、1 時間ごと
* **モデル: WeatherNext 2** (Google DeepMind)
  * 0.25° (約 25 km) の格子、6 時間 × 40 回 = **10 日先まで**
  * 学習は 2024 年まで。今日の台風はどれも**学習の外**
  * 後継の WeatherNext 3 (2026-09 発表) は予報サービスとしての提供で、モデルは非公開

</div>

<div class="highlight-box dense">

* 初期値は「後から観測を集めて作った状態」
* **実際の予報の腕試しではなく**、「状態がよく分かっていたら、どこまで先を読めるか」(予測可能性) の実験

</div>

Note: ERA5 の速報版 (ERA5T) を使っている。ARCO-ERA5 は数か月遅れるので使えなかった。

### アンサンブル: 1 回の予報で 8 本

<div class="simple-box">

* 天気予報は初期値鋭敏: 小さな違いが数日で大きく育つ
* WeatherNext 2 はモデルの中に**ノイズ**を入れて、同じ初期値から**少しずつ違う未来**を出す
* 8 本の**ばらつき = 予報の自信のなさ**

</div>

<br>

<div class="highlight-box">

今回は 8 本とも**初期値は同じ ERA5**。ばらつきはゼロから育つので、実際の誤差より小さめに出る (Appendix)

</div>

### 台風の中心をどう追うか

<div class="simple-box">

* WeatherNext 2 に**付属の追跡プログラム**をそのまま使う (自作しない)
* 6 時間ごとに**閉じた渦**を見つけて、つないで経路にする
* 観測の位置は**一切渡さない**: モデルが自分で台風を生む
* 台風になった時刻に観測に一番近い渦を、その台風とする

</div>

<div class="highlight-box">

追跡プログラムが追うのは「台風」ではなく「**渦**」(あとで効いてくる)

</div>

Note: 観測の位置を渡しても 6 時間後以降の経路は変わらなかった。渡すと 2.5 日未満の経路を消すフィルタが外れるので、全ケース渡さないことにした。

### そして誰もループしない

<div class="simple-box">

* 40 本の行き先: **北 30 本**、大陸 4 本、東 1 本、観測の範囲内 5 本

<br>

### 結果 3: 「道」と「時計」に分ける

<div class="two-column">
<div class="column-figure">
<svg class="diagram" viewBox="0 0 680 360" width="680" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<polyline points="20,330 230,262 440,170 640,60" fill="none" stroke="#2E2A24" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="275" y1="79" x2="335" y2="216" stroke="#2367B8" stroke-width="3" stroke-dasharray="9 7"/>
<circle cx="230" cy="262" r="11" fill="#2E2A24"/>
<circle cx="275" cy="79" r="11" fill="#2367B8"/>
<circle cx="335" cy="216" r="8" fill="#fff" stroke="#2E2A24" stroke-width="3"/>
<text x="298" y="86" font-size="24" font-weight="700" fill="#2367B8">予報 (時刻 t)</text>
<text x="280" y="156" font-size="24" fill="#2367B8" text-anchor="end">道からの距離</text>
<text x="356" y="246" font-size="24" fill="#2E2A24">最寄り点:</text>
<text x="356" y="276" font-size="24" fill="#2E2A24">観測が通ったのは t + 6 h</text>
<text x="210" y="316" font-size="24" font-weight="700" fill="#2E2A24">観測 (時刻 t)</text>
<text x="540" y="174" font-size="24" fill="#2E2A24">観測の経路</text>
</svg>
</div>
<div class="column-text">

<div class="simple-box dense">

* **道**: 予報の位置から観測の経路までの最短距離。200 km 以内なら「道の上」
* **時計**: 最寄り点を観測の台風が通った時刻 − 予報の時刻。<b>+ なら先行</b> (この例は +6 h)
* 経路の端より先に行った位置は、道を外れたとは数えず別に数える

</div>

</div>
</div>

Note: 進行方向に沿った「前後・左右」に分ける普通のやり方は、ループで向きが回るクロヴァンには使えない。200 km は 18 枚目の「観測の位置から 200 km 以内」と同じ値で、予報の早い段階の誤差と同じくらいの大きさ。台風についていけているかどうかを分ける線で、良いメンバーとより良いメンバーを分ける線ではない。距離と時計の定義には入らず、「道の上」を数えるときと、時計をまとめるメンバーを選ぶときだけに使う。

### 台風の経路の Péclet 数

<div class="two-column">
<div class="column-figure">
<svg class="diagram" viewBox="0 0 600 260" width="600" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<defs><marker id="arrow-pe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2367B8"/></marker></defs>
<polyline points="30,190 108,163 190,143 268,113 345,88" fill="none" stroke="#2367B8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-pe)"/>
<line x1="30" y1="190" x2="345" y2="88" stroke="#B9531D" stroke-width="3" stroke-dasharray="9 7"/>
<polyline points="400,150 490,95 540,185 450,200 505,118" fill="none" stroke="#2367B8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-pe)"/>
<line x1="400" y1="150" x2="505" y2="118" stroke="#B9531D" stroke-width="3" stroke-dasharray="9 7"/>
<line x1="20" y1="23" x2="64" y2="23" stroke="#B9531D" stroke-width="3" stroke-dasharray="9 7"/>
<text x="74" y="32" font-size="24" fill="#B9531D">正味の移動</text>
<text x="190" y="246" font-size="24" font-weight="700" fill="#2E2A24" text-anchor="middle">Pe 大: 向きがそろう</text>
<text x="470" y="246" font-size="24" font-weight="700" fill="#2E2A24" text-anchor="middle">Pe 小: うろうろ</text>
</svg>
</div>
<div class="formula-box">
$$ \mathrm{Pe} = \dfrac{\left\lvert \sum\limits_{i=1}^{n} \Delta \mathbf{x}_{i} \right\rvert^{2}}{\sum\limits_{i=1}^{n} \left\lvert \Delta \mathbf{x}_{i} - \overline{\Delta \mathbf{x}} \right\rvert^{2}} $$
</div>
</div>

<div class="simple-box dense">

* 分子: 窓のあいだの**正味の移動** (ドリフト) の 2 乗
* 分母: 6 時間ごとの歩幅の**ばらつき** (拡散)。同じ歩幅から測るので、拡散係数を外から持ち込まない

</div>

Note: Péclet 数と呼ぶ理由: 一定のドリフトに拡散が乗った動きなら、分子と分母の期待値の比は古典的な Péclet 数 UL/D の単調関数になる (Appendix)。期待値の比であって、比の期待値ではない。

### 仮定を足さない (1): 何と比べるか

<div class="simple-box dense">

* 「Pe がいくつなら停滞」という線は引かない (線を引くと「台風はこう動くはず」という仮定が入る)
* → **同じ時刻・同じ長さの窓での、観測の台風の Pe** と比べる: $\log_{10} (\mathrm{Pe}^{\mathrm{member}} / \mathrm{Pe}^{\mathrm{obs}})$
  * 0: 観測と同じ / +1: メンバーの Pe が観測の 10 倍 (よりまっすぐ) / −1: 1/10 (よりうろうろ)
* Pe は 2 乗どうしの比 = 信号 (ドリフト) と雑音 (揺らぎ) の**パワーの比**。だから比の $\log_{10}$ は **dB と同じ読み方**: +1 は +10 dB
* 対数にすると、10 倍と 1/10 が 0 を挟んで**対称**になる

</div>

<div class="highlight-box dense">

比なので、値が動いたのが**メンバーか観測か**は、両方を見て読む

</div>

Note: Pe = n × (歩幅の平均の 2 乗 / 歩幅の分散) で、1 歩あたりの信号と雑音の比 (SNR) の n 倍。同じ窓で比べると n が消えて、比は SNR の比になる。2 乗の量の比なので 10 log10 が dB (振幅の比なら 20 log10)。スライドの値に単位を付けるならベルで、10 倍すると dB。対数にしないと、まっすぐ側は 1 から無限大まで伸び、うろうろ側は 0〜1 に押し込まれて、白を真ん中にした色の帯が使えない。図の色は ±1 (10 倍) で振り切れる。ランダムウォークなら Pe ≈ n/(n−1) (4 歩で 1.33) だが、台風はランダムウォークではないので基準にしない (Appendix)。この値は位置を見ていない。観測から遠く離れたメンバーでも、同じくらいまっすぐ動いていれば 0 になる。

### 仮定を足さない (2): 窓の長さ

<div class="simple-box dense">

* 窓の長さを 1 つに決める = **「何時間とどまったら停滞か」を測る側が決める**こと
* 同じ時刻でも、窓の長さで答えが変わる
  * 09-04 00Z のクロヴァン: 18 時間の窓で Pe 0.2 (うろうろ)、48 時間の窓で 2.3 (向きがそろう)
  * 停滞は約 1 日、ループは約 2 日。現象ごとに効く長さが違う
* 9 月に一度つまずいた: 「24 時間で 300 km 未満なら停滞」と決め打ちしたら、**遅いがまっすぐ**な動きまで停滞に数えていた (→「外れた仮説」)

</div>

<div class="highlight-box dense">

1 つに決めず、**18〜36 時間の窓を全部並べて**、窓の長さによらない特徴だけを読む

</div>

Note: 下限の 18 時間は、ばらつきを 3 歩以上から測れる最短の窓。2 歩 (12 時間) だと、ばらつきは 2 つの歩幅の差 1 つだけで決まってしまう。データから窓を自動で選ぶ方法 (Pe の時間変化の折れ目を読む) も試したが、どの時刻でも 12 時間に張り付いて使えなかった。上限の 36 時間は区切りで決めたもので、物理的な根拠はない。ループ (約 2 日) と同じ長さの窓は並べていない。

<div class="simple-box dense">

* 22 枚目は中央値。遅れは**全員**か、一部か
* **形**: Chamfer 距離 (互いの最寄り点までの平均)。時刻は使わない
* **時計の変化率** $b$: 道の上の時計 (20 枚目) に引いた直線の傾き [h/h]

<div>
$$ b \approx \frac{v_{\text{予報}}}{v_{\text{観測}}} - 1 \quad \text{(同じ場所で)} $$
</div>

</div>

</div>
</div>

<div class="highlight-box dense">

$b$ は遅れが溜まる平均のペースで、時計そのものではない

</div>

Note: 時計 c は、予報の位置の最寄り点を観測の台風が通った時刻 τ から、予報の時刻 t を引いたもの。同じ場所なので、観測が時刻 τ までに道に沿って進んだ距離と、予報が時刻 t までに進んだ距離は等しい。t で微分すると「観測の速さ (τ) × dτ/dt = 予報の速さ (t)」、だから dc/dt = dτ/dt − 1 = 予報の速さ (t) / 観測の速さ (τ) − 1。直線は道の上の点が 3 つ以上あるメンバーにだけ、最小二乗で引く。傾きは、直線を引いた範囲の平均の比になる。b = −0.32 なら 1 日 (24 h) に約 7.7 h ずつ遅れが溜まる。ただし時計は 0 から一直線には溜まっていない: クロヴァンの 48 h の時計は中央値 −8 h で、−0.32 × 48 h = −15 h とは合わない (理由は未確認)。縦軸に傾きを選んだ理由: 予報全体の時計の中央値は、ドゥージェンの「転向まで 0 h、転向後に +14 h」を薄める。ある時刻 (48、72、96 h) の時計は、回によってはループの後や温帯低気圧になった後で読めない。傾きは全員に値がある。

### Appendix: 時間伸縮 (DTW) を使わなかった理由

<div class="simple-box dense">

* DTW: 予報の各点を観測の経路の一区間に、順序を保って対応づける。時計と形が 1 回で出る…はず
* 道の上にいるメンバー: 最寄り点の時計と一致 (ドゥージェン: 順位相関 0.95、99% が 6 h 以内)
* 道を外れたメンバー: **どの終わり方でも人工物**が出る
  * 経路の終点に縛る → 尾が終点に引かれて「先行」
  * 終点を自由にする → 尾が 1 点に張りつき −1 h/h で「遅れ」(132 h で −75 h)
* 200 km 以内に限ると、最寄り点の時計と同じになる → **整列は何も足さない**

</div>

<div class="simple-box">

* どの回も 09-05 00Z (停滞とループ) に 400–670 km へ跳ねる

<div class="simple-box">

* 速報値の「発生」は**台風への昇格**、追跡は**どんな閉じた渦でも**拾う
  * → 今は「渦の検出」と「昇格」の比較になっている
* 確定値で熱帯低気圧の行が入れば、比べ直せる

### Appendix: なぜ Péclet 数と呼ぶか

<div class="simple-box dense">

1 歩を一定のドリフトと揺らぎに分ける (2 次元、揺らぎは独立で平均 0)

<div>
$$ \Delta \mathbf{x}_{i} = \mathbf{U} \Delta t + \boldsymbol{\xi}_{i}, \qquad \langle \lvert \boldsymbol{\xi}_{i} \rvert^{2} \rangle = 4 D \Delta t $$
</div>

窓の長さ $T = n \Delta t$、そのあいだにドリフトで進む距離 $L = U T$ とおくと

<div>
$$ \frac{\langle \text{Pe の分子} \rangle}{\langle \text{Pe の分母} \rangle} =\frac{n^{2} U^{2} (\Delta t)^{2} + 4 n D \Delta t}{4 (n - 1) D \Delta t} = \frac{n}{n - 1} \left( 1 + \frac{U L}{4 D} \right) $$
</div>

</div>

<div class="highlight-box dense">

古典的な Péclet 数 $UL/D$ の単調関数。$U = 0$ (ランダムウォーク) なら ${n / (n - 1)}$ (4 歩で 1.33)。期待値の比で、比の期待値ではない。台風はこのモデルどおりに動かないので、基準には使わなかった

</div>

---

### Appendix: 異常拡散の指数も試した

<div class="simple-box">

* 平均二乗変位 $\mathrm{MSD}(\tau) \propto \tau^{\alpha}$ の $\alpha$ なら、停滞 (閉じ込め) とループ (回転) を区別できる…かもしれない
* 6 時間ごとの位置、1〜2 日の窓では、観測も含めて**どの経路も 1.5–1.9**
* クロヴァンのループそのものでも 1.63
* → 6 時間おきのデータでは分解能が足りない

</div>

### Appendix: 追跡プログラムの癖

<div class="simple-box">

* 2.5 日 (60 時間) より短い経路は消される
* ペイパーは熱帯低気圧の期間を含めても 72 時間しかなく (台風としては 42 時間)、転向の前後で経路が切れると消える
  * 選ばれたのは 5 回それぞれ 8 本中 5, 8, 5, 8, 6 本
  * 消える制限を外して追い直すと、**全員が台風を持っていた**
* → 足りないのは追跡プログラムで、モデルではない

</div>

    // Footer of every slide: chapter name, progress bar and page number.
    // A chapter starts at a slide carrying data-chapter and runs up to the
    // next one. The slide with data-appendix starts the appendix, which shows
    // its chapter name only; pages are counted over the main part.
    function buildFooters(deck) {
      const slides = deck.getSlides();
      const appendixStart = slides.findIndex((s) => s.hasAttribute('data-appendix'));
      const mainCount = appendixStart >= 0 ? appendixStart : slides.length;

      const chapters = [];
      slides.forEach((slide, index) => {
        if (slide.dataset.chapter) {
          chapters.push({ name: slide.dataset.chapter, start: index });
        }
      });
      chapters.forEach((chapter, k) => {
        const next = k + 1 < chapters.length ? chapters[k + 1].start : slides.length;
        chapter.end = next - 1;
      });
      const mainChapters = chapters.filter((c) => c.start < mainCount);

      slides.forEach((slide, index) => {
        if (slide.classList.contains('title-slide') || slide.classList.contains('divider')) {
          return;
        }
        const chapter = chapters.filter((c) => c.start <= index).pop();
        const footer = document.createElement('div');
        footer.className = 'slide-footer';

        const name = document.createElement('span');
        name.className = 'footer-chapter';
        name.textContent = chapter ? chapter.name : '';
        footer.appendChild(name);

        if (index < mainCount) {
          const bar = document.createElement('span');
          bar.className = 'footer-progress';
          bar.setAttribute('aria-hidden', 'true');
          mainChapters.forEach((c) => {
            const last = Math.min(c.end, mainCount - 1);
            const segment = document.createElement('span');
            segment.style.flex = `${last - c.start + 1} 1 0px`;
            if (last < index) {
              segment.className = 'done';
            } else if (c.start <= index) {
              segment.className = 'current';
              const fill = document.createElement('span');
              fill.style.width = `${(100 * (index - c.start + 1)) / (last - c.start + 1)}%`;
              segment.appendChild(fill);
            }
            bar.appendChild(segment);
          });
          footer.appendChild(bar);

          const page = document.createElement('span');
          page.className = 'footer-page';
          page.textContent = `${index + 1} / ${mainCount}`;
          footer.appendChild(page);
        }

        slide.appendChild(footer);
      });
    }

    Reveal.on('ready', () => buildFooters(Reveal));

  </script>
